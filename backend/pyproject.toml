[project]
name = "e-help"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "qiaogang02", email = "qiaogang02@baidu.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "langchain>=1.2.12",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.18",
    "langchain-openai>=1.1.11",
    "langchain-text-splitters>=1.1.1",
    "langgraph>=1.1.2",
    "pymilvus>=2.6.12",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "loguru>=0.7.3",
    "sse-starlette>=3.3.4",
    "httpx>=0.28.1",
]

[project.scripts]
e-help = "e_help.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
